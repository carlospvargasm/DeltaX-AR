<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07180f">
<title>DeltaX AR V2</title>
<link rel="stylesheet" href="v2.css?v=1">
</head>
<body>
<main id="app" data-state="welcome">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="scan" width="640" height="360"></canvas>
  <canvas id="captureCanvas" class="hidden"></canvas>
  <div class="shade"></div>

  <header class="brand">
    <div class="mark">ΔX</div>
    <div class="word">DELTAX</div>
    <div class="tagline">Descubre el valor invisible</div>
  </header>

  <div id="bird" class="bird"><img src="assets/torogoz-deltax.webp?v=1" alt="Torogoz DeltaX"></div>
  <div id="recognitionBadge" class="badge">✓ ¡LÁMINA RECONOCIDA!</div>

  <section id="viewport" class="viewport">
    <div id="welcomeVisual" class="welcome-visual">
      <div class="mountains"></div><div class="fields"></div><div class="orbit"></div>
      <div class="visual-mark">ΔX</div><div class="visual-word">DELTAX</div>
      <div class="visual-copy">Descubre el valor invisible</div>
    </div>
    <div id="sceneOverlay" class="scene-overlay hidden">
      <small id="sceneNo"></small><h1 id="sceneTitle"></h1><p id="sceneSub"></p><strong id="flow"></strong>
    </div>
  </section>
  <div id="instruction" class="instruction">Activa la cámara para comenzar</div>

  <section class="actions">
    <button id="start" class="primary" disabled><span>▣</span><b id="cameraLabel">ACTIVAR CÁMARA</b></button>
    <button id="manual" class="secondary">⚙ MODO MANUAL</button>
  </section>

  <section id="media" class="media">
    <button id="photo"><span>📷</span><b>Foto</b></button>
    <button id="record"><span class="rec-dot"></span><b>Video</b></button>
    <a id="website" href="https://deltax.space" target="_blank" rel="noopener"><span>🌐</span><b>DeltaX</b></a>
  </section>

  <footer>◆ <span>Naturaleza que genera valor</span></footer>
  <div id="status">Preparando reconocimiento…</div>
  <div id="picker" class="picker hidden"></div>
  <div id="captureNotice" class="notice hidden"></div>
</main>
<script src="config.js?v=1"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="v2.js?v=1"></script>
</body>
</html>
