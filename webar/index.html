<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07180f">
<title>DeltaX Panamá</title>
<link rel="stylesheet" href="v2.css?v=panama20">
</head>
<body>
<main id="app" data-state="welcome">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="captureCanvas"></canvas>
  <div class="shade"></div>
  <div class="dx-live">ΔX</div>

  <header class="brand">
    <div class="mark">ΔX</div><div class="word">DELTAX</div>
    <div class="tagline">Descubre el valor invisible</div>
  </header>

  <div class="bird bird-static"><img src="assets/torogoz-deltax.webp?v=20" alt="Torogoz DeltaX"></div>
  <div class="bird bird-lr"><img src="assets/torogoz-deltax.webp?v=20" alt=""></div>
  <div class="bird bird-rl"><img src="assets/torogoz-deltax.webp?v=20" alt=""></div>
  <div class="bird bird-low"><img src="assets/torogoz-deltax.webp?v=20" alt=""></div>
  <div class="bird bird-up"><img src="assets/torogoz-deltax.webp?v=20" alt=""></div>
  <div class="bird bird-down"><img src="assets/torogoz-deltax.webp?v=20" alt=""></div>
  <div class="bird bird-runner"><img src="assets/torogoz-deltax.webp?v=20" alt=""></div>

  <div id="welcome" class="welcome"><div class="welcome-logo">ΔX</div><strong>DELTAX</strong><span>Descubre el valor invisible</span></div>
  <div id="instruction" class="instruction">Activa la cámara para comenzar</div>
  <button id="start" class="start">ACTIVAR CÁMARA</button>

  <section id="media" class="media">
    <button id="cameraSwitch" class="round secondary" aria-label="Cambiar cámara">
      <svg viewBox="0 0 32 32"><path d="M7 11a11 11 0 0 1 18-2M24 4l2 5-5 1M25 21a11 11 0 0 1-18 2M8 28l-2-5 5-1"/></svg>
      <b>Frontal</b>
    </button>
    <button id="shutter" class="shutter" aria-label="Tomar selfie"><i></i><b>SELFIE</b></button>
    <button id="record" class="round secondary record" aria-label="Grabar video"><i></i><b>REC</b><em id="recordTimer">00:00</em></button>
  </section>
  <a class="website" href="https://deltax.space" target="_blank" rel="noopener"><strong>ΔX</strong> DeltaX</a>
  <div id="notice" class="notice"></div>
</main>
<script src="v2.js?v=panama20"></script>
</body></html>
